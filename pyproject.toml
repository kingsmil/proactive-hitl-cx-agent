[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "customerclaw"
version = "0.1.0"
description = "Proactive HITL customer-experience agent — FastAPI + LLM orchestrator"
requires-python = ">=3.6"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "openai",
    "apscheduler",
    "sse-starlette",
    "jinja2",
    "python-multipart",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.setuptools.packages.find]
where = ["."]
include = ["db*", "agent*", "api*", "poller*"]
