{# LLM thought entry — expandable details in etl-row format #}
<div class="etl-row">
    <div class="etl-spine">
        <div class="etl-dot dot-lav"></div>
        <div class="etl-line"></div>
    </div>
    <div class="etl-body">
        <div class="etl-header">
            <span class="etl-type">LLM</span>
            <span class="etl-actor">agent</span>
        </div>
        <details class="thought-expand" style="margin-top:2px;">
            <summary class="thought-expand-summary"
                style="cursor:pointer; list-style:none; display:flex; align-items:center; gap:6px;">
                <span class="etl-desc" style="flex:1;">{{ preview }}</span>
                <span class="thought-expand-arrow"
                    style="font-size:10px; color:var(--text-dim); flex-shrink:0;">▸</span>
            </summary>
            <div class="thought-expand-body">
                {% if request_messages %}
                <div class="thought-section">
                    <div class="thought-section-label">Request · {{ request_count }} messages</div>
                    <pre class="thought-code">{{ request_messages }}</pre>
                </div>
                {% endif %}
                {% if response_text %}
                <div class="thought-section">
                    <div class="thought-section-label">Response</div>
                    <pre class="thought-code">{{ response_text }}</pre>
                </div>
                {% endif %}
            </div>
        </details>
    </div>
</div>
