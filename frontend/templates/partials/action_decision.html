{% if decision == "approved" %}
<div class="action-card result-approved">
    <svg width="14" height="14" viewBox="0 0 14 14" fill="none" style="flex-shrink:0;">
        <circle cx="7" cy="7" r="5.5" stroke="currentColor" stroke-width="1.2" />
        <polyline points="4.5,7 6.5,9 9.5,5" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round"
            stroke-linejoin="round" />
    </svg>
    <span>
        Approved — action executed &nbsp;
        <code style="font-family:var(--font-mono); font-size:9px; opacity:0.6;">{{ session_id[-6:] }}</code>
    </span>
</div>
{% else %}
<div class="action-card result-rejected">
    <svg width="14" height="14" viewBox="0 0 14 14" fill="none" style="flex-shrink:0;">
        <circle cx="7" cy="7" r="5.5" stroke="currentColor" stroke-width="1.2" />
        <line x1="4.5" y1="4.5" x2="9.5" y2="9.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
        <line x1="9.5" y1="4.5" x2="4.5" y2="9.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
    </svg>
    <span>
        Denied — customer will be notified &nbsp;
        <code style="font-family:var(--font-mono); font-size:9px; opacity:0.6;">{{ session_id[-6:] }}</code>
    </span>
</div>
{% endif %}

<!-- Real-time queue count badge update -->
<span id="queue-count" hx-swap-oob="innerHTML">{{ pending_count }} pending</span>

<!-- Append processing bubble to chat pane seamlessly -->
<div id="chat-stream-{{ session_id }}" hx-swap-oob="beforeend">
    <div class="msg-agent msg-agent-right">
        <div class="msg-agent-body msg-agent-body-right" id="reply-body-{{ session_id }}">
            <div class="msg-agent-bubble pending" style="opacity:0.7;">
                <span class="pending-orbs"><span></span><span></span><span></span></span>
                <span style="font-family:var(--font-body); font-style:italic; font-size:13px;">processing…</span>
            </div>
            <div class="msg-meta" style="text-align:right; color:var(--gold-dim);">processing</div>
            <div sse-swap="done" hx-swap="innerHTML" hx-target="#reply-body-{{ session_id }}"></div>
        </div>
        <div class="msg-avatar">✧</div>
    </div>
</div>
