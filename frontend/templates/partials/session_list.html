<!-- Session list — self-polling wrapper (polls /inbox/sessions, NOT /inbox) -->
<div
        id="session-list"
    hx-get="/inbox/sessions"
    hx-trigger="every 5s"
    hx-target="#session-list"
    hx-swap="outerHTML"
    style="flex:1; overflow-y:auto; padding:8px 10px; display:flex; flex-direction:column; gap:4px;"
>
    {% if sessions %}
        {% for session in sessions %}
            {% include "partials/session_item.html" %}
        {% endfor %}
    {% else %}
        <div style="
            display:flex; flex-direction:column; align-items:center; justify-content:center;
            height:100%; gap:10px; color:var(--text-dim); text-align:center; padding:20px;
        ">Ø
            <svg width="36" height="36" viewBox="0 0 36 36" fill="none" style="opacity:0.3;">
                <rect x="4" y="8" width="28" height="20" rx="2" stroke="currentColor" stroke-width="1.2"/>
                <path d="M4 13h28" stroke="currentColor" stroke-width="1"/>
                <circle cx="10" cy="10.5" r="1" fill="currentColor" opacity="0.5"/>
                <circle cx="14" cy="10.5" r="1" fill="currentColor" opacity="0.5"/>
                <circle cx="18" cy="10.5" r="1" fill="currentColor" opacity="0.5"/>
            </svg>
            <span style="font-family:var(--font-display); font-size:10px; letter-spacing:0.2em; text-transform:uppercase;">No sessions</span>
            <span style="font-family:var(--font-body); font-style:italic; font-size:12px; color:var(--text-ghost); line-height:1.7;">
                Use the form above to inject<br/>a customer message.
            </span>
        </div>
    {% endif %}
</div>
