<!-- Single rules chat message bubble -->
{% if msg.role == 'user' %}
<div style="
    align-self: flex-end;
    max-width: 85%;
    background: var(--lav-glow, rgba(140,120,200,0.08));
    border: 1px solid var(--border-mist);
    border-radius: var(--radius);
    padding: 8px 12px;
    font-family: var(--font-body);
    font-size: 12px;
    color: var(--text-main);
    line-height: 1.5;
    word-break: break-word;
">{{ msg.content }}</div>
{% elif msg.role == 'assistant' %}
<div style="
    align-self: flex-start;
    max-width: 85%;
    display: flex;
    gap: 8px;
    align-items: flex-start;
">
    <div style="
        flex-shrink: 0;
        width: 22px; height: 22px;
        border-radius: 50%;
        background: var(--surface);
        border: 1px solid var(--border-mist);
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: var(--font-display);
        font-size: 9px;
        color: var(--pb-court);
    ">R</div>
    <div style="
        background: var(--lift, rgba(255,255,255,0.03));
        border: 1px solid var(--border-mist);
        border-radius: var(--radius);
        padding: 8px 12px;
        font-family: var(--font-body);
        font-size: 12px;
        color: var(--text-main);
        line-height: 1.5;
        word-break: break-word;
        white-space: pre-wrap;
    ">{{ msg.content }}</div>
</div>
{% endif %}
