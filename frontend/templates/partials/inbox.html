<!-- Inbox panel content — polled every 5s, targets #right-content -->

<!-- New Customer Message form -->
<div class="inbox-form-wrap">
    <form hx-post="/chat/customer-message" hx-target="#commune-content" hx-swap="innerHTML"
        hx-on::after-request="this.querySelector('textarea').value=''" class="inbox-form">
        <div class="inbox-form-label">
            New Customer Message
        </div>

        <textarea name="message" required class="inbox-textarea" placeholder="Type the customer's message…"
            rows="2"></textarea>

        <div class="inbox-form-row">
            <!-- Channel selector -->
            <select name="channel" class="inbox-select" style="flex:0 0 auto; width:auto;">
                <option value="web">🌐 Web</option>
                <option value="whatsapp" disabled title="Coming soon">💬 WhatsApp (soon)</option>
            </select>

            <!-- Session target -->
            <select name="session_id" class="inbox-select" style="flex:1; min-width:0;">
                <option value="">+ New Conversation</option>
                {% for s in sessions %}
                <option value="{{ s.session_id }}" {% if active_session_id is defined and
                    active_session_id==s.session_id %} selected{% endif %}>{{ s.session_id[-6:] }}
                    {% if s.status == "RUNNING" %}▸{% elif s.status == "PAUSED" %}⚠{% else %}·{% endif %}
                    {{ s.channel }}
                </option>
                {% endfor %}
            </select>

            <button type="submit" class="btn-inject">Send</button>
        </div>
    </form>
</div>

<!-- Divider -->
<div style="height:1px; background:var(--border-mist); margin:0 14px;"></div>

<!-- Demo: Trigger Proactive Outreach -->
<div style="padding:8px 14px;">
    <form hx-post="/demo/trigger-outreach" hx-target="#demo-result" hx-swap="innerHTML"
        style="display:flex; align-items:center; gap:6px;">
        <input name="phone" class="inbox-select" style="flex:1; min-width:0; font-size:11px;"
            placeholder="Phone filter (optional)" />
        <button type="submit" class="btn-inject" style="font-size:10px; padding:5px 10px; white-space:nowrap;">
            Trigger Outreach
        </button>
    </form>
    <div id="demo-result" style="font-size:11px; color:var(--text-dim); margin-top:4px;"></div>
</div>

<!-- Divider -->
<div style="height:1px; background:var(--border-mist); margin:0 14px;"></div>
