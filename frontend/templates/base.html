<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}CustomerClaw{% endblock %}</title>

    <!--
        Varela Round - Soft, friendly headers
        Nunito       - Highly legible, rounded body text
        JetBrains Mono- Clean, slightly technical monospace
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Varela+Round&family=Nunito:ital,wght@0,400;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet" />

    <script src="https://unpkg.com/htmx.org@2/dist/htmx.min.js"></script>
    <script src="https://unpkg.com/htmx-ext-sse@2/sse.js"></script>

    <style>
        /* ── Design tokens ──────────────────────────────────────────────── */
        :root {
            /* Backgrounds: Clean White */
            --void: #ffffff;
            --panel: #ffffff;
            --surface: #ffffff;
            --lift: #f7faf8;
            --raise: #eef5f1;

            /* Mint Green (Primary) */
            --pb-court: #2fbc7f;
            --pb-court-dim: rgba(47, 188, 127, 0.45);
            --pb-court-glow: rgba(47, 188, 127, 0.12);

            /* Lavender (Secondary/Accent) */
            --pb-accent: #8b7ec8;
            --pb-accent-dim: rgba(139, 126, 200, 0.5);
            --pb-accent-glow: rgba(139, 126, 200, 0.12);

            /* Amber/Gold */
            --pb-sun: #e8a830;
            --pb-sun-dim: rgba(232, 168, 48, 0.45);
            --pb-sun-glow: rgba(232, 168, 48, 0.12);

            /* Coral/Danger */
            --pb-coral: #e85c5c;
            --pb-coral-dim: rgba(232, 92, 92, 0.45);
            --pb-coral-glow: rgba(232, 92, 92, 0.10);

            /* Sky/Info */
            --pb-sky: #3fafd7;

            /* Aliases (used by node tags, inbox, etc.) */
            --lav: #8b7ec8;
            --lav-dim: rgba(139, 126, 200, 0.45);
            --lav-glow: rgba(139, 126, 200, 0.10);
            --sage: #2fbc7f;
            --sage-glow: rgba(47, 188, 127, 0.10);
            --gold: #e8a830;
            --gold-dim: rgba(232, 168, 48, 0.45);
            --gold-glow: rgba(232, 168, 48, 0.10);
            --sky: #3fafd7;
            --rose: #e85c5c;
            --rose-dim: rgba(232, 92, 92, 0.45);

            /* Borders — stronger for contrast on white */
            --border-mist: rgba(45, 52, 54, 0.08);
            --border-dim: rgba(45, 52, 54, 0.15);
            --border-mid: rgba(45, 52, 54, 0.22);
            --border-soft: rgba(45, 52, 54, 0.32);

            /* Text — darker for readability */
            --text-bright: #1a1d1e;
            --text-mid: #4a5256;
            --text-dim: #8a9499;
            --text-ghost: #c8cdd0;

            --font-display: 'Varela Round', sans-serif;
            --font-body: 'Nunito', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;

            --radius: 12px;
        }

        /* ── Reset ─────────────────────────────────────────────────────── */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            height: 100%;
            background: var(--void);
            color: var(--text-bright);
            font-family: var(--font-body);
            font-size: 15px;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        /* ── Background: Subtle mint dot grid ────────────────────────────── */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                radial-gradient(circle, rgba(47, 188, 127, 0.08) 1px, transparent 1px);
            background-size: 32px 32px;
            pointer-events: none;
            z-index: 0;
            opacity: 0.6;
        }

        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 40vh;
            background: linear-gradient(180deg, rgba(47, 188, 127, 0.06) 0%, transparent 100%);
            pointer-events: none;
            z-index: -1;
        }

        /* ── Scrollbar ─────────────────────────────────────────────────── */
        ::-webkit-scrollbar {
            width: 3px;
            height: 3px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border-dim);
            border-radius: 2px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--lav-dim);
        }

        /* ── Panels ────────────────────────────────────────────────────── */
        .panel {
            background: var(--panel);
            border: 1px solid var(--border-mist);
            border-radius: var(--radius);
            position: relative;
            overflow: hidden;
        }

        /* Delicate top shimmer line */
        .panel::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent 5%, var(--pb-court) 40%, var(--pb-sun) 60%, transparent 95%);
            opacity: 0.8;
        }

        .panel-header {
            padding: 10px 16px;
            border-bottom: 1px solid var(--border-mist);
            font-family: var(--font-display);
            font-size: 10px;
            font-weight: 500;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--text-dim);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }

        .panel-header-title {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-mid);
        }

        .panel-star {
            color: var(--pb-court-dim);
            font-size: 14px;
            line-height: 1;
        }

        /* ── Wordmark ───────────────────────────────────────────────────── */
        .wordmark {
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 16px;
            letter-spacing: 0.1em;
            color: var(--text-bright);
        }

        .wordmark em {
            font-style: normal;
            color: var(--pb-court);
        }

        /* ── Chips / badges ─────────────────────────────────────────────── */
        .chip {
            font-family: var(--font-display);
            font-size: 8px;
            font-weight: 500;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            padding: 2px 7px;
            border-radius: 2px;
        }

        .chip-outline {
            border: 1px solid var(--border-dim);
            color: var(--text-dim);
        }

        .chip-gold {
            background: var(--pb-sun-glow);
            border: 1px solid var(--pb-sun-dim);
            color: var(--pb-sun);
        }

        .chip-sage {
            background: var(--pb-court-glow);
            border: 1px solid var(--pb-court-dim);
            color: var(--pb-court);
        }

        .chip-rose {
            background: var(--pb-coral-glow);
            border: 1px solid var(--pb-coral-dim);
            color: var(--pb-coral);
        }

        .chip-lav {
            background: var(--pb-accent-glow);
            border: 1px solid var(--pb-accent-dim);
            color: var(--pb-accent);
        }

        /* ── Node tags (thought log) ────────────────────────────────────── */
        .node-tag {
            font-family: var(--font-display);
            font-size: 10px;
            font-weight: 400;
            letter-spacing: 0.15em;
            padding: 2px 8px;
            border-radius: 2px;
            text-transform: uppercase;
            flex-shrink: 0;
        }

        .node-supervisor {
            background: var(--lav-glow);
            color: var(--lav);
            border: 1px solid var(--lav-dim);
        }

        .node-reason {
            background: rgba(63, 175, 215, 0.10);
            color: var(--sky);
            border: 1px solid rgba(63, 175, 215, 0.30);
        }

        .node-execute {
            background: var(--sage-glow);
            color: var(--sage);
            border: 1px solid rgba(47, 188, 127, 0.30);
        }

        .node-hitl {
            background: var(--gold-glow);
            color: var(--gold);
            border: 1px solid var(--gold-dim);
        }

        .node-llm {
            background: var(--lav-glow);
            color: var(--lav);
            border: 1px solid var(--lav-dim);
        }

        .node-unknown {
            background: rgba(255, 255, 255, 0.03);
            color: var(--text-dim);
            border: 1px solid var(--border-mist);
        }

        /* ── Chat bubbles ───────────────────────────────────────────────── */
        .msg-user {
            display: flex;
            justify-content: flex-end;
            margin: 8px 0;
        }

        .msg-user-body {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
            max-width: 78%;
        }

        .msg-user-bubble {
            background: var(--pb-sun-glow);
            border: 1px solid var(--pb-sun-dim);
            border-radius: var(--radius) 1px var(--radius) var(--radius);
            padding: 10px 14px;
            color: var(--text-bright);
            font-family: var(--font-body);
            font-size: 15px;
            line-height: 1.6;
        }

        .msg-meta {
            font-family: var(--font-display);
            font-size: 8px;
            letter-spacing: 0.12em;
            color: var(--text-dim);
            text-transform: uppercase;
        }

        .msg-agent {
            display: flex;
            gap: 9px;
            margin: 8px 0;
            align-items: flex-start;
        }

        .msg-avatar {
            width: 28px;
            height: 28px;
            background: var(--surface);
            border: 1px solid var(--border-dim);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            flex-shrink: 0;
            margin-top: 2px;
            color: var(--pb-court);
        }

        .msg-agent-body {
            display: flex;
            flex-direction: column;
            gap: 4px;
            max-width: 78%;
        }

        .msg-agent-bubble {
            background: var(--surface);
            border: 1px solid var(--border-dim);
            border-radius: 1px var(--radius) var(--radius) var(--radius);
            padding: 9px 13px;
            color: var(--text-bright);
            font-family: var(--font-body);
            font-size: 15px;
            line-height: 1.6;
        }

        .msg-agent-bubble.pending {
            border-color: var(--pb-sun-dim);
            color: var(--pb-sun);
            font-style: italic;
        }

        /* Streaming reply span — text appears here as chunks arrive */
        .streaming-reply {
            display: inline;
        }

        /* Hide the spinner once the first token lands */
        .streaming-reply:not(:empty)+.pending-orbs {
            display: none;
        }

        /* Waiting orbs */
        .pending-orbs {
            display: inline-flex;
            gap: 4px;
            margin-right: 7px;
            vertical-align: middle;
        }

        .pending-orbs span {
            width: 6px;
            height: 6px;
            background: var(--pb-court);
            border-radius: 50%;
            opacity: 0.4;
            animation: pbBounce 0.6s cubic-bezier(0.34, 1.2, 0.64, 1) infinite alternate;
        }

        .pending-orbs span:nth-child(2) {
            animation-delay: 0.25s;
        }

        .pending-orbs span:nth-child(3) {
            animation-delay: 0.5s;
        }

        @keyframes orbrise {

            0%,
            100% {
                opacity: 0.2;
                transform: translateY(0);
            }

            50% {
                opacity: 0.9;
                transform: translateY(-3px);
            }
        }

        /* ── Thought log entry ──────────────────────────────────────────── */
        .thought-entry {
            display: flex;
            gap: 10px;
            padding: 8px 0;
            border-bottom: 1px solid var(--border-mist);
            align-items: flex-start;
            animation: pbBounce 0.4s cubic-bezier(0.34, 1.2, 0.64, 1) both;
        }

        .thought-entry:last-child {
            border-bottom: none;
        }

        .thought-text {
            font-size: 14px;
            color: var(--text-mid);
            line-height: 1.55;
            word-break: break-word;
            font-family: var(--font-mono);
        }

        .thought-sigil {
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--pb-court-dim);
            background: var(--pb-court-glow);
            border: 1px solid var(--pb-court-dim);
            padding: 2px 6px;
            border-radius: 2px;
            flex-shrink: 0;
            letter-spacing: 0.04em;
            cursor: default;
        }

        /* ── Expandable LLM thought entry ──────────────────────────────── */
        .thought-llm {
            flex-wrap: wrap;
        }

        .thought-expand {
            flex: 1 1 100%;
            min-width: 0;
        }

        .thought-expand-summary {
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            list-style: none;
            user-select: none;
        }

        .thought-expand-summary::-webkit-details-marker {
            display: none;
        }

        .thought-expand-summary .thought-text {
            flex: 1;
        }

        .thought-expand-arrow {
            font-size: 11px;
            color: var(--text-dim);
            transition: transform 0.2s ease;
            flex-shrink: 0;
        }

        details.thought-expand[open] .thought-expand-arrow {
            transform: rotate(90deg);
        }

        .thought-expand-body {
            margin-top: 8px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .thought-section {
            background: var(--surface);
            border: 1px solid var(--border-mist);
            border-radius: var(--radius);
            overflow: hidden;
        }

        .thought-section-label {
            font-family: var(--font-display);
            font-size: 9px;
            font-weight: 500;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--text-dim);
            padding: 6px 10px;
            border-bottom: 1px solid var(--border-mist);
            background: var(--lift);
        }

        .thought-code {
            font-family: var(--font-mono);
            font-size: 11px;
            line-height: 1.6;
            color: var(--text-mid);
            padding: 10px 12px;
            margin: 0;
            white-space: pre-wrap;
            word-break: break-word;
            max-height: 260px;
            overflow-y: auto;
        }

        /* ── Action card ────────────────────────────────────────────────── */
        .action-card {
            background: var(--surface);
            border: 1px solid var(--border-dim);
            border-left: 2px solid var(--pb-sun);
            border-radius: var(--radius);
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            position: relative;
        }

        .action-card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 6px;
        }

        .action-tool-name {
            font-family: var(--font-display);
            font-size: 13px;
            font-weight: 700;
            color: var(--pb-court);
            letter-spacing: 0.06em;
        }

        .action-args {
            background: var(--lift);
            border: 1px solid var(--border-mist);
            border-radius: var(--radius);
            padding: 10px 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .action-arg-row {
            display: flex;
            gap: 8px;
            font-size: 12px;
            font-family: var(--font-mono);
        }

        .action-arg-key {
            color: var(--text-dim);
            flex-shrink: 0;
        }

        .action-arg-val {
            color: var(--text-bright);
            font-weight: 500;
        }

        .action-reasoning {
            font-family: var(--font-body);
            font-style: italic;
            font-size: 12px;
            color: var(--text-mid);
            line-height: 1.6;
            padding-left: 10px;
            border-left: 2px solid var(--border-dim);
        }

        .action-sid {
            font-size: 10px;
            color: var(--text-dim);
            font-family: var(--font-mono);
        }

        /* ── Approve / Reject buttons ───────────────────────────────────── */
        .btn-action-row {
            display: flex;
            gap: 8px;
        }

        .btn-approve {
            flex: 1;
            background: var(--pb-court-glow);
            border: 1px solid var(--pb-court-dim);
            color: var(--pb-court);
            font-family: var(--font-display);
            font-size: 9px;
            font-weight: 500;
            letter-spacing: 0.18em;
            padding: 9px 8px;
            cursor: pointer;
            border-radius: var(--radius);
            transition: background 0.2s, border-color 0.2s;
            text-transform: uppercase;
        }

        .btn-approve:hover {
            background: var(--pb-court-dim);
            border-color: var(--pb-court);
        }

        .btn-reject {
            flex: 1;
            background: var(--pb-coral-glow);
            border: 1px solid var(--pb-coral-dim);
            color: var(--pb-coral);
            font-family: var(--font-display);
            font-size: 9px;
            font-weight: 500;
            letter-spacing: 0.18em;
            padding: 9px 8px;
            cursor: pointer;
            border-radius: var(--radius);
            transition: background 0.2s, border-color 0.2s;
            text-transform: uppercase;
        }

        .btn-reject:hover {
            background: var(--pb-coral-dim);
            border-color: var(--pb-coral);
        }

        /* ── Terminal input ─────────────────────────────────────────────── */
        .commune-input {
            background: transparent;
            border: none;
            border-bottom: 1px solid var(--border-dim);
            color: var(--text-bright);
            font-family: var(--font-body);
            font-style: italic;
            font-size: 13px;
            outline: none;
            width: 100%;
            padding: 5px 2px;
            transition: border-color 0.2s;
        }

        .commune-input:focus {
            border-bottom-color: var(--pb-accent);
        }

        .commune-input::placeholder {
            color: var(--text-dim);
            font-style: italic;
        }

        .btn-send {
            background: transparent;
            border: 1px solid var(--border-dim);
            color: var(--pb-accent-dim);
            font-family: var(--font-display);
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.1em;
            padding: 7px 14px;
            cursor: pointer;
            border-radius: var(--radius);
            transition: background 0.2s, color 0.2s, border-color 0.2s, transform 0.1s;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .btn-send:hover {
            background: var(--pb-accent-glow);
            color: var(--pb-accent);
            border-color: var(--pb-accent-dim);
            transform: scale(1.02);
        }

        /* ── Ethereal live indicator ────────────────────────────────────── */
        .live-orb {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: transparent;
            border: 2px solid var(--pb-court);
            box-shadow: 0 0 5px var(--pb-court), 0 0 12px var(--pb-court-glow);
            animation: etherealpulse 3s ease-in-out infinite;
        }

        @keyframes etherealpulse {

            0%,
            100% {
                opacity: 1;
                box-shadow: 0 0 5px var(--pb-court), 0 0 12px var(--pb-court-glow);
            }

            50% {
                opacity: 0.4;
                box-shadow: 0 0 3px var(--pb-court);
            }
        }

        /* ── HTMX indicator ─────────────────────────────────────────────── */
        .htmx-indicator {
            display: none;
        }

        .htmx-request .htmx-indicator {
            display: flex;
        }

        .htmx-request.htmx-indicator {
            display: flex;
        }

        /* ── Processing ─────────────────────────────────────────────────── */
        .weaving-dots span {
            color: var(--pb-accent);
            animation: weavedot 1.5s ease-in-out infinite both;
        }

        .weaving-dots span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .weaving-dots span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes weavedot {

            0%,
            80%,
            100% {
                opacity: 0.1;
            }

            40% {
                opacity: 0.9;
            }
        }

        /* ── Decision results ───────────────────────────────────────────── */
        .result-approved {
            border: 1px solid var(--pb-court-dim);
            border-left: 2px solid var(--pb-court);
            background: var(--pb-court-glow);
            color: var(--pb-court);
            padding: 12px 14px;
            border-radius: var(--radius);
            font-family: var(--font-display);
            font-size: 9px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 9px;
        }

        .result-rejected {
            border: 1px solid var(--pb-coral-dim);
            border-left: 2px solid var(--pb-coral);
            background: var(--pb-coral-glow);
            color: var(--pb-coral);
            padding: 12px 14px;
            border-radius: var(--radius);
            font-family: var(--font-display);
            font-size: 9px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 9px;
        }

        /* ── Page-load stagger ──────────────────────────────────────────── */
        @keyframes driftIn {
            0% {
                opacity: 0;
                transform: translateY(16px);
            }

            80% {
                transform: translateY(-2px);
            }

            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .panel {
            animation: driftIn 0.5s cubic-bezier(0.34, 1.2, 0.64, 1) both;
        }

        .panel:nth-child(1) {
            animation-delay: 0.05s;
        }

        .panel:nth-child(2) {
            animation-delay: 0.12s;
        }

        .panel:nth-child(3) {
            animation-delay: 0.19s;
        }

        /* ── Mobile tab bar ─────────────────────────────────────────────── */
        .tab-nav {
            display: none;
            flex-shrink: 0;
            background: var(--panel);
            border-top: 1px solid var(--border-mist);
            order: 99;
        }

        .tab-btn {
            flex: 1;
            background: transparent;
            border: none;
            border-top: 2px solid transparent;
            color: var(--text-dim);
            font-family: var(--font-display);
            font-size: 8px;
            font-weight: 500;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            padding: 12px 6px 10px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            transition: color 0.2s, border-color 0.2s;
            min-height: 52px;
        }

        .tab-btn svg {
            opacity: 0.4;
            transition: opacity 0.2s;
        }

        .tab-btn.active {
            color: var(--pb-court);
            border-top-color: var(--pb-court);
        }

        .tab-btn.active svg {
            opacity: 0.85;
        }

        .queue-badge {
            position: absolute;
            top: 8px;
            right: calc(50% - 15px);
            background: var(--pb-sun);
            color: var(--void);
            font-family: var(--font-display);
            font-size: 7px;
            font-weight: 600;
            min-width: 15px;
            height: 15px;
            border-radius: 8px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0 4px;
            line-height: 1;
        }

        .queue-badge:empty {
            display: none;
        }

        /* ── Responsive ─────────────────────────────────────────────────── */
        @media (max-width: 767px) {
            .tab-nav {
                display: flex;
            }

            .panes-container {
                flex-direction: column !important;
                padding: 0 !important;
                gap: 0 !important;
            }

            .pane {
                display: none !important;
                border-radius: 0 !important;
                border-left: none !important;
                border-right: none !important;
                border-bottom: none !important;
            }

            .pane::after {
                display: none;
            }

            .pane.active {
                display: flex !important;
                flex: 1;
            }

            .btn-approve,
            .btn-reject {
                padding: 13px 8px;
                font-size: 9px;
            }

            .btn-send {
                padding: 10px 16px;
            }

            button {
                touch-action: manipulation;
            }

            .commune-input {
                font-size: 16px !important;
            }

            .header-session {
                display: none;
            }

            .msg-user-bubble,
            .msg-agent-bubble {
                font-size: 16px;
            }
        }

        @media (min-width: 768px) {
            .pane {
                display: flex !important;
                flex: 1;
            }

            .tab-nav {
                display: none !important;
            }
        }

        /* ── Settings modal ─────────────────────────────────────────────── */
        .settings-overlay {
            position: fixed;
            inset: 0;
            z-index: 9998;
            background: rgba(11, 12, 24, 0.72);
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(3px);
            animation: driftIn 0.2s ease both;
        }

        .settings-panel {
            width: min(460px, 92vw);
            max-height: 88vh;
            overflow-y: auto;
            animation: driftIn 0.25s cubic-bezier(.22, 1, .36, 1) both;
        }

        .btn-settings-close {
            background: transparent;
            border: none;
            color: var(--text-dim);
            cursor: pointer;
            font-size: 14px;
            line-height: 1;
            padding: 2px 4px;
            border-radius: var(--radius);
            transition: color 0.15s;
        }

        .btn-settings-close:hover {
            color: var(--pb-coral);
        }

        .settings-field {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .settings-label {
            font-family: var(--font-display);
            font-size: 9px;
            font-weight: 500;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: var(--text-dim);
        }

        .settings-input {
            background: var(--lift);
            border: 1px solid var(--border-dim);
            border-radius: var(--radius);
            color: var(--text-bright);
            font-family: var(--font-mono);
            font-size: 12px;
            outline: none;
            padding: 8px 11px;
            transition: border-color 0.2s;
            width: 100%;
        }

        .settings-input:focus {
            border-color: var(--pb-accent);
        }

        .settings-input::placeholder {
            color: var(--text-dim);
        }

        .settings-hint {
            font-family: var(--font-body);
            font-style: italic;
            font-size: 11px;
            color: var(--text-dim);
            line-height: 1.5;
        }

        .btn-gear {
            background: transparent;
            border: 1px solid var(--border-mist);
            border-radius: var(--radius);
            color: var(--text-dim);
            cursor: pointer;
            padding: 5px 7px;
            display: flex;
            align-items: center;
            transition: color 0.2s, border-color 0.2s;
        }

        .btn-gear:hover {
            color: var(--pb-court);
            border-color: var(--pb-court-dim);
        }

        /* ── Customer bubble (left-aligned) ────────────────────────────── */
        .msg-customer {
            justify-content: flex-start !important;
        }

        .msg-customer-bubble {
            background: var(--lav-glow) !important;
            border: 1px solid var(--lav-dim) !important;
            border-radius: 1px var(--radius) var(--radius) var(--radius) !important;
        }

        /* ── Agent message — right-aligned ─────────────────────────────── */
        .msg-agent-right {
            flex-direction: row-reverse !important;
            justify-content: flex-start;
        }

        .msg-agent-body-right {
            align-items: flex-end !important;
        }

        .msg-agent-body-right .msg-agent-bubble {
            border-radius: var(--radius) 1px var(--radius) var(--radius) !important;
        }

        /* ── Manual agent message — accent border ────────────────────────── */
        .msg-manual {
            border-left: 2px solid var(--pb-court) !important;
            border-color: var(--pb-court-dim) !important;
        }

        .msg-avatar-agent {
            background: var(--pb-court-glow) !important;
            border-color: var(--pb-court-dim) !important;
            color: var(--pb-court) !important;
        }

        /* ── Agent reply form ──────────────────────────────────────────── */
        .commune-reply-form {
            padding: 10px 16px;
            border-top: 1px solid var(--border-mist);
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex-shrink: 0;
        }

        .commune-reply-label {
            font-family: var(--font-display);
            font-size: 8px;
            font-weight: 500;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: var(--text-dim);
        }

        .commune-textarea {
            resize: none;
            height: auto;
            min-height: 38px;
            max-height: 100px;
        }

        .commune-input:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .btn-send:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* ── AI toggle button ────────────────────────────────────────────── */
        .btn-ai-toggle {
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--lift);
            border: 1px solid var(--border-dim);
            border-radius: 20px;
            padding: 4px 10px 4px 6px;
            cursor: pointer;
            color: var(--text-dim);
            font-family: var(--font-display);
            font-size: 8px;
            font-weight: 500;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            transition: background 0.2s, border-color 0.2s, color 0.2s;
            white-space: nowrap;
        }

        .btn-ai-toggle:hover {
            border-color: var(--border-mid);
            color: var(--text-mid);
        }

        .btn-ai-toggle.ai-on {
            background: var(--sage-glow);
            border-color: rgba(47, 188, 127, 0.35);
            color: var(--sage);
        }

        .ai-toggle-pip {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--text-dim);
            flex-shrink: 0;
            transition: background 0.2s, box-shadow 0.2s;
        }

        .btn-ai-toggle.ai-on .ai-toggle-pip {
            background: var(--sage);
            box-shadow: 0 0 6px rgba(47, 188, 127, 0.5);
            animation: etherealpulse 2.5s ease-in-out infinite;
        }

        .ai-toggle-label {
            line-height: 1;
        }

        /* ── Pane tabs (Inbox / Approvals) ─────────────────────────────── */
        .pane-tab {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            background: transparent;
            border: none;
            border-bottom: 2px solid transparent;
            padding: 9px 10px 8px;
            font-family: var(--font-display);
            font-size: 8px;
            font-weight: 500;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: var(--text-dim);
            cursor: pointer;
            transition: color 0.2s, border-color 0.2s;
            position: relative;
        }

        .pane-tab svg {
            opacity: 0.4;
            transition: opacity 0.2s;
        }

        .pane-tab.active {
            color: var(--gold);
            border-bottom-color: var(--gold);
        }

        .pane-tab.active svg {
            opacity: 0.8;
        }

        .pane-tab-badge {
            background: var(--gold);
            color: var(--void);
            font-size: 7px;
            font-weight: 600;
            min-width: 14px;
            height: 14px;
            border-radius: 7px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0 3px;
            line-height: 1;
        }

        .pane-tab-badge:empty {
            display: none;
        }

        /* ── Session items (inbox) ───────────────────────────────────────── */
        .session-item {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 14px 16px;
            border: 1px solid var(--border-mist);
            border-radius: var(--radius);
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s;
            background: var(--surface);
            position: relative;
            overflow: hidden;
            margin-bottom: 4px;
        }

        .session-item:hover {
            background: var(--lift);
            border-color: var(--border-dim);
        }

        .session-item-icon {
            position: relative;
            flex-shrink: 0;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 2px;
        }

        .session-pulse {
            position: absolute;
            inset: -3px;
            border-radius: 50%;
            border: 1.5px solid var(--sage);
            animation: etherealpulse 2.5s ease-in-out infinite;
        }

        .session-item-body {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .session-item-top {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .session-sigil-small {
            font-family: var(--font-mono);
            font-size: 13px;
            color: var(--gold-dim);
            letter-spacing: 0.05em;
        }

        .session-item-preview {
            font-family: var(--font-body);
            font-size: 14px;
            color: var(--text-mid);
            line-height: 1.5;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
            font-style: italic;
        }

        .session-item-preview em {
            color: var(--text-dim);
            font-style: italic;
        }

        /* AI badge dot */
        .ai-badge {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--text-dim);
            flex-shrink: 0;
            display: inline-block;
        }

        .ai-badge-on {
            background: var(--sage);
            box-shadow: 0 0 5px rgba(47, 188, 127, 0.4);
        }

        /* ── Inbox form ─────────────────────────────────────────────────── */
        .inbox-form-wrap {
            padding: 12px 12px 10px;
            flex-shrink: 0;
        }

        .inbox-form {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .inbox-form-label {
            font-family: var(--font-display);
            font-size: 8px;
            font-weight: 500;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--text-dim);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .inbox-textarea {
            background: var(--lift);
            border: 1px solid var(--border-dim);
            border-radius: var(--radius);
            color: var(--text-bright);
            font-family: var(--font-body);
            font-size: 12px;
            line-height: 1.5;
            outline: none;
            padding: 7px 10px;
            width: 100%;
            resize: none;
            transition: border-color 0.2s;
            font-style: italic;
        }

        .inbox-textarea:focus {
            border-color: var(--lav);
        }

        .inbox-textarea::placeholder {
            color: var(--text-dim);
        }

        .inbox-form-row {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .inbox-select {
            background: var(--lift);
            border: 1px solid var(--border-dim);
            border-radius: var(--radius);
            color: var(--text-mid);
            font-family: var(--font-mono);
            font-size: 10px;
            padding: 5px 7px;
            outline: none;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .inbox-select:focus {
            border-color: var(--lav);
        }

        .btn-inject {
            background: var(--lav-glow);
            border: 1px solid var(--lav-dim);
            color: var(--lav);
            font-family: var(--font-display);
            font-size: 8px;
            font-weight: 500;
            letter-spacing: 0.14em;
            padding: 6px 11px;
            cursor: pointer;
            border-radius: var(--radius);
            transition: background 0.2s, border-color 0.2s;
            text-transform: uppercase;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .btn-inject:hover {
            background: rgba(139, 126, 200, 0.14);
            border-color: var(--lav);
        }

        /* ── reason-input (action card) ─────────────────────────────────── */
        .reason-input {
            background: transparent;
            border: 1px solid var(--border-mist);
            border-radius: var(--radius);
            color: var(--text-mid);
            font-family: var(--font-body);
            font-style: italic;
            font-size: 11px;
            outline: none;
            padding: 5px 9px;
            width: 100%;
            transition: border-color 0.2s;
        }

        .reason-input:focus {
            border-color: var(--rose);
        }

        .reason-input::placeholder {
            color: var(--text-dim);
            font-style: italic;
        }

        /* ── Error toast ─────────────────────────────────────────────────── */
        #error-toast {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            pointer-events: none;
            max-width: 360px;
            min-width: 220px;
        }

        #error-toast:not(:empty) {
            pointer-events: auto;
            animation:
                toast-in 0.3s cubic-bezier(.22, 1, .36, 1) both,
                toast-out 0.4s ease-in 5s both;
        }

        .toast-error {
            background: var(--surface);
            border: 1px solid var(--pb-coral-dim);
            border-left: 2px solid var(--pb-coral);
            border-radius: var(--radius);
            padding: 13px 16px;
            display: flex;
            align-items: flex-start;
            gap: 11px;
            box-shadow:
                0 4px 28px rgba(0, 0, 0, 0.55),
                0 0 0 1px var(--pb-coral-glow);
        }

        .toast-error-icon {
            color: var(--pb-coral);
            font-size: 13px;
            flex-shrink: 0;
            margin-top: 1px;
            opacity: 0.85;
        }

        .toast-error-title {
            font-family: var(--font-display);
            font-size: 9px;
            font-weight: 500;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--pb-coral);
            margin-bottom: 5px;
        }

        .toast-error-body {
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--text-mid);
            line-height: 1.55;
            word-break: break-word;
        }

        @keyframes toast-in {
            from {
                opacity: 0;
                transform: translateX(18px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes toast-out {
            to {
                opacity: 0;
                transform: translateX(18px);
                pointer-events: none;
            }
        }

        /* ── Order timeline ────────────────────────────────────────────── */
        .order-timeline {
            display: flex;
            flex-direction: column;
            gap: 0;
            padding-left: 4px;
        }

        .timeline-event {
            display: grid;
            grid-template-columns: 14px 1fr;
            grid-template-rows: auto 1fr;
            gap: 0 12px;
            min-height: 48px;
        }

        .timeline-dot {
            grid-column: 1;
            grid-row: 1;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            border: 2px solid var(--border-mid);
            background: var(--surface);
            margin-top: 4px;
            justify-self: center;
            z-index: 1;
        }

        .timeline-dot-order_placed {
            border-color: var(--sage);
            background: var(--sage-glow);
        }

        .timeline-dot-status_changed {
            border-color: var(--gold);
            background: var(--gold-glow);
        }

        .timeline-dot-order_lookup {
            border-color: var(--sky);
            background: rgba(63, 175, 215, 0.12);
        }

        .timeline-dot-refund_requested {
            border-color: var(--gold);
            background: var(--gold-glow);
        }

        .timeline-dot-refund_approved {
            border-color: var(--sage);
            background: var(--sage-glow);
        }

        .timeline-dot-refund_rejected {
            border-color: var(--rose);
            background: rgba(232, 92, 92, 0.10);
        }

        .timeline-dot-refund_executed {
            border-color: var(--sage);
            background: var(--sage-glow);
        }

        .timeline-dot-outreach_triggered {
            border-color: var(--lav);
            background: var(--lav-glow);
        }

        /* message events */
        .timeline-dot-user_message {
            border-color: var(--gold);
            background: var(--gold-glow);
        }

        .timeline-dot-agent_reply {
            border-color: var(--sage);
            background: var(--sage-glow);
        }

        /* tool events */
        .timeline-dot-tool_call {
            border-color: var(--sky);
            background: rgba(63, 175, 215, 0.12);
        }

        .timeline-dot-tool_result {
            border-color: var(--border-mid);
            background: var(--surface);
        }

        /* agent thought nodes */
        .timeline-dot-supervisor {
            border-color: var(--lav);
            background: var(--lav-glow);
        }

        .timeline-dot-execute {
            border-color: var(--sage);
            background: var(--sage-glow);
        }

        .timeline-dot-hitl {
            border-color: var(--gold);
            background: var(--gold-glow);
        }

        .timeline-dot-llm {
            border-color: var(--lav);
            background: var(--lav-glow);
        }

        .timeline-dot-reason {
            border-color: var(--sky);
            background: rgba(63, 175, 215, 0.12);
        }

        .timeline-line {
            grid-column: 1;
            grid-row: 2;
            width: 2px;
            background: var(--border-dim);
            justify-self: center;
            min-height: 16px;
        }

        .timeline-content {
            grid-column: 2;
            grid-row: 1 / 3;
            padding-bottom: 14px;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .timeline-header {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .timeline-type {
            font-family: var(--font-display);
            font-size: 11px;
            font-weight: 600;
            color: var(--text-bright);
            letter-spacing: 0.04em;
        }

        .timeline-actor {
            font-family: var(--font-mono);
            font-size: 9px;
            color: var(--text-dim);
            background: var(--lift);
            border: 1px solid var(--border-mist);
            padding: 1px 5px;
            border-radius: 2px;
        }

        .timeline-desc {
            font-family: var(--font-body);
            font-size: 12px;
            color: var(--text-mid);
            line-height: 1.5;
        }

        .timeline-time {
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--text-dim);
        }

        /* ── Event Log Timeline (etl) ─────────────────────────────────────── */
        #thought-log {
            overflow-y: auto;
            flex: 1;
        }

        .event-timeline {
            padding: 12px 14px 6px;
            display: flex;
            flex-direction: column;
        }

        .etl-row {
            display: flex;
            gap: 12px;
            align-items: flex-start;
        }

        .etl-spine {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-shrink: 0;
            width: 12px;
        }

        .etl-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            border: 2px solid var(--border-mid);
            background: var(--surface);
            flex-shrink: 0;
            margin-top: 4px;
            z-index: 1;
        }

        .etl-line {
            width: 2px;
            flex: 1;
            min-height: 12px;
            background: var(--border-dim);
            margin-top: 2px;
        }

        .etl-row:last-child .etl-line {
            display: none;
        }

        /* dot color variants */
        .dot-sage {
            border-color: var(--sage);
            background: var(--sage-glow);
        }

        .dot-gold {
            border-color: var(--gold);
            background: var(--gold-glow);
        }

        .dot-rose {
            border-color: var(--rose);
            background: rgba(232, 92, 92, 0.10);
        }

        .dot-sky {
            border-color: var(--sky);
            background: rgba(63, 175, 215, 0.12);
        }

        .dot-lav {
            border-color: var(--lav);
            background: var(--lav-glow);
        }

        .dot-dim {
            border-color: var(--border-mid);
            background: var(--surface);
        }

        .etl-body {
            flex: 1;
            min-width: 0;
            padding-bottom: 14px;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .etl-header {
            display: flex;
            align-items: center;
            gap: 7px;
            flex-wrap: wrap;
        }

        .etl-type {
            font-family: var(--font-display);
            font-size: 11px;
            font-weight: 600;
            color: var(--text-bright);
            letter-spacing: 0.04em;
        }

        .etl-actor {
            font-family: var(--font-mono);
            font-size: 9px;
            color: var(--text-dim);
            background: var(--lift);
            border: 1px solid var(--border-mist);
            border-radius: 2px;
            padding: 1px 5px;
        }

        .etl-order {
            font-family: var(--font-mono);
            font-size: 9px;
            color: var(--gold-dim);
            letter-spacing: 0.05em;
        }

        .etl-desc {
            font-family: var(--font-body);
            font-size: 12px;
            color: var(--text-mid);
            line-height: 1.5;
            word-break: break-word;
        }

        .etl-ts {
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--text-dim);
        }

        .etl-expand {
            margin: 0;
        }

        .etl-expand-summary {
            cursor: pointer;
            list-style: none;
            display: flex;
