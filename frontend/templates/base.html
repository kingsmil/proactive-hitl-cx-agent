<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}CustomerClaw{% endblock %}</title>

    <!--
        Cinzel      — classical Roman small-caps, ancient tome feel
        Lora        — warm literary serif, readable storybook body text
        Inconsolata — clean monospace for data & session IDs
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Lora:ital,wght@0,400;0,500;1,400;1,500&family=Inconsolata:wght@400;500&display=swap" rel="stylesheet" />

    <script src="https://unpkg.com/htmx.org@2/dist/htmx.min.js"></script>
    <script src="https://unpkg.com/htmx-ext-sse@2/sse.js"></script>

    <style>
        /* ── Design tokens ─────────────────────────────────────────────── */
        :root {
            --void:        #0b0c18;
            --panel:       #10111e;
            --surface:     #161828;
            --lift:        #1c1e33;
            --raise:       #22253e;

            /* Frieren palette */
            --sage:        #8bb89a;
            --sage-dim:    rgba(139,184,154,0.55);
            --sage-glow:   rgba(139,184,154,0.09);

            --lav:         #b8b2d0;
            --lav-dim:     rgba(184,178,208,0.6);
            --lav-glow:    rgba(184,178,208,0.07);

            --gold:        #d4c08a;
            --gold-dim:    rgba(212,192,138,0.6);
            --gold-glow:   rgba(212,192,138,0.09);

            --rose:        #c9938c;
            --rose-dim:    rgba(201,147,140,0.6);
            --rose-glow:   rgba(201,147,140,0.08);

            --sky:         #8aaed4;

            --border-mist: rgba(200,196,224,0.07);
            --border-dim:  rgba(200,196,224,0.13);
            --border-mid:  rgba(200,196,224,0.22);
            --border-soft: rgba(200,196,224,0.35);

            --text-bright: #e8e4d9;
            --text-mid:    #8f8fad;
            --text-dim:    #3e3e5a;
            --text-ghost:  #222235;

            --font-display: 'Cinzel', serif;
            --font-body:    'Lora', serif;
            --font-mono:    'Inconsolata', monospace;

            --radius: 4px;
        }

        /* ── Reset ─────────────────────────────────────────────────────── */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            height: 100%;
            background: var(--void);
            color: var(--text-bright);
            font-family: var(--font-body);
            font-size: 13px;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        /* ── Background: star field + moonlight ────────────────────────── */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            /* Three overlapping star patterns at prime-number spacings (no obvious tiling) */
            background-image:
                radial-gradient(circle, rgba(255,255,255,0.50) 1px, transparent 1px),
                radial-gradient(circle, rgba(200,192,232,0.38) 1px, transparent 1px),
                radial-gradient(circle, rgba(212,192,138,0.22) 1px, transparent 1px);
            background-size:
                97px 97px,
                157px 157px,
                223px 223px;
            background-position:
                11px 23px,
                53px 71px,
                137px 19px;
            pointer-events: none;
            z-index: 0;
            animation: starfield 18s ease-in-out infinite alternate;
        }
        @keyframes starfield {
            from { opacity: 0.7; }
            to   { opacity: 1; }
        }

        body::after {
            content: '';
            position: fixed;
            top: -20vh; left: 50%;
            transform: translateX(-50%);
            width: 80vw; height: 65vh;
            background: radial-gradient(ellipse, rgba(184,178,208,0.05) 0%, transparent 65%);
            pointer-events: none;
            z-index: 0;
        }

        /* ── Scrollbar ─────────────────────────────────────────────────── */
        ::-webkit-scrollbar { width: 3px; height: 3px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border-dim); border-radius: 2px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--lav-dim); }

        /* ── Panels ────────────────────────────────────────────────────── */
        .panel {
            background: var(--panel);
            border: 1px solid var(--border-mist);
            border-radius: var(--radius);
            position: relative;
            overflow: hidden;
        }
        /* Delicate top shimmer line */
        .panel::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent 5%, var(--lav) 40%, var(--gold) 60%, transparent 95%);
            opacity: 0.2;
        }

        .panel-header {
            padding: 10px 16px;
            border-bottom: 1px solid var(--border-mist);
            font-family: var(--font-display);
            font-size: 10px;
            font-weight: 500;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--text-dim);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }
        .panel-header-title {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-mid);
        }
        .panel-star { color: var(--gold-dim); font-size: 12px; line-height: 1; }

        /* ── Wordmark ───────────────────────────────────────────────────── */
        .wordmark {
            font-family: var(--font-display);
            font-weight: 600;
            font-size: 14px;
            letter-spacing: 0.18em;
            color: var(--text-bright);
        }
        .wordmark em {
            font-style: normal;
            color: var(--gold);
        }

        /* ── Chips / badges ─────────────────────────────────────────────── */
        .chip {
            font-family: var(--font-display);
            font-size: 8px;
            font-weight: 500;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            padding: 2px 7px;
            border-radius: 2px;
        }
        .chip-outline { border: 1px solid var(--border-dim); color: var(--text-dim); }
        .chip-gold    { background: var(--gold-glow);  border: 1px solid rgba(212,192,138,0.3); color: var(--gold); }
        .chip-sage    { background: var(--sage-glow);  border: 1px solid rgba(139,184,154,0.28); color: var(--sage); }
        .chip-rose    { background: var(--rose-glow);  border: 1px solid rgba(201,147,140,0.25); color: var(--rose); }
        .chip-lav     { background: var(--lav-glow);   border: 1px solid rgba(184,178,208,0.25); color: var(--lav); }

        /* ── Node tags (thought log) ────────────────────────────────────── */
        .node-tag {
            font-family: var(--font-display);
            font-size: 8px;
            font-weight: 400;
            letter-spacing: 0.15em;
            padding: 1px 6px;
            border-radius: 2px;
            text-transform: uppercase;
            flex-shrink: 0;
        }
        .node-supervisor { background: rgba(184,178,208,0.1); color: var(--lav);  border: 1px solid rgba(184,178,208,0.22); }
        .node-reason     { background: rgba(138,174,212,0.1); color: var(--sky);  border: 1px solid rgba(138,174,212,0.22); }
        .node-execute    { background: var(--sage-glow);       color: var(--sage); border: 1px solid rgba(139,184,154,0.22); }
        .node-hitl       { background: var(--gold-glow);       color: var(--gold); border: 1px solid rgba(212,192,138,0.25); }
        .node-unknown    { background: rgba(255,255,255,0.03); color: var(--text-dim); border: 1px solid var(--border-mist); }

        /* ── Chat bubbles ───────────────────────────────────────────────── */
        .msg-user {
            display: flex;
            justify-content: flex-end;
            margin: 8px 0;
        }
        .msg-user-body {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
            max-width: 78%;
        }
        .msg-user-bubble {
            background: rgba(212,192,138,0.08);
            border: 1px solid rgba(212,192,138,0.2);
            border-radius: var(--radius) 1px var(--radius) var(--radius);
            padding: 9px 13px;
            color: var(--text-bright);
            font-family: var(--font-body);
            font-size: 13px;
            line-height: 1.6;
        }
        .msg-meta {
            font-family: var(--font-display);
            font-size: 8px;
            letter-spacing: 0.12em;
            color: var(--text-dim);
            text-transform: uppercase;
        }

        .msg-agent {
            display: flex;
            gap: 9px;
            margin: 8px 0;
            align-items: flex-start;
        }
        .msg-avatar {
            width: 24px;
            height: 24px;
            background: var(--surface);
            border: 1px solid var(--border-dim);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            flex-shrink: 0;
            margin-top: 2px;
            color: var(--gold-dim);
        }
        .msg-agent-body {
            display: flex;
            flex-direction: column;
            gap: 4px;
            max-width: 78%;
        }
        .msg-agent-bubble {
            background: var(--surface);
            border: 1px solid var(--border-mist);
            border-radius: 1px var(--radius) var(--radius) var(--radius);
            padding: 9px 13px;
            color: var(--text-bright);
            font-family: var(--font-body);
            font-size: 13px;
            line-height: 1.6;
        }
        .msg-agent-bubble.pending {
            border-color: rgba(212,192,138,0.2);
            color: var(--gold-dim);
            font-style: italic;
        }

        /* Waiting orbs */
        .pending-orbs {
            display: inline-flex;
            gap: 4px;
            margin-right: 7px;
            vertical-align: middle;
        }
        .pending-orbs span {
            width: 5px; height: 5px;
            background: var(--gold);
            border-radius: 50%;
            opacity: 0.3;
            animation: orbrise 1.6s ease-in-out infinite both;
        }
        .pending-orbs span:nth-child(2) { animation-delay: 0.25s; }
        .pending-orbs span:nth-child(3) { animation-delay: 0.5s; }
        @keyframes orbrise {
            0%, 100% { opacity: 0.2; transform: translateY(0); }
            50%       { opacity: 0.9; transform: translateY(-3px); }
        }

        /* ── Thought log entry ──────────────────────────────────────────── */
        .thought-entry {
            display: flex;
            gap: 9px;
            padding: 6px 0;
            border-bottom: 1px solid var(--border-mist);
            align-items: flex-start;
        }
        .thought-entry:last-child { border-bottom: none; }
        .thought-text {
            font-size: 11.5px;
            color: var(--text-mid);
            line-height: 1.55;
            word-break: break-word;
            font-family: var(--font-mono);
        }

        /* ── Action card ────────────────────────────────────────────────── */
        .action-card {
            background: var(--surface);
            border: 1px solid var(--border-dim);
            border-left: 2px solid var(--gold);
            border-radius: var(--radius);
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            position: relative;
        }
        .action-card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 6px;
        }
        .action-tool-name {
            font-family: var(--font-display);
            font-size: 12px;
            font-weight: 500;
            color: var(--gold);
            letter-spacing: 0.06em;
        }
        .action-args {
            background: var(--lift);
            border: 1px solid var(--border-mist);
            border-radius: var(--radius);
            padding: 10px 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .action-arg-row {
            display: flex;
            gap: 8px;
            font-size: 12px;
            font-family: var(--font-mono);
        }
        .action-arg-key { color: var(--text-dim); flex-shrink: 0; }
        .action-arg-val { color: var(--text-bright); font-weight: 500; }
        .action-reasoning {
            font-family: var(--font-body);
            font-style: italic;
            font-size: 12px;
            color: var(--text-mid);
            line-height: 1.6;
            padding-left: 10px;
            border-left: 2px solid var(--border-dim);
        }
        .action-sid {
            font-size: 10px;
            color: var(--text-dim);
            font-family: var(--font-mono);
        }

        /* ── Approve / Reject buttons ───────────────────────────────────── */
        .btn-action-row {
            display: flex;
            gap: 8px;
        }
        .btn-approve {
            flex: 1;
            background: var(--sage-glow);
            border: 1px solid rgba(139,184,154,0.28);
            color: var(--sage);
            font-family: var(--font-display);
            font-size: 9px;
            font-weight: 500;
            letter-spacing: 0.18em;
            padding: 9px 8px;
            cursor: pointer;
            border-radius: var(--radius);
            transition: background 0.2s, border-color 0.2s;
            text-transform: uppercase;
        }
        .btn-approve:hover {
            background: rgba(139,184,154,0.18);
            border-color: var(--sage);
        }
        .btn-reject {
            flex: 1;
            background: var(--rose-glow);
            border: 1px solid rgba(201,147,140,0.25);
            color: var(--rose);
            font-family: var(--font-display);
            font-size: 9px;
            font-weight: 500;
            letter-spacing: 0.18em;
            padding: 9px 8px;
            cursor: pointer;
            border-radius: var(--radius);
            transition: background 0.2s, border-color 0.2s;
            text-transform: uppercase;
        }
        .btn-reject:hover {
            background: rgba(201,147,140,0.18);
            border-color: var(--rose);
        }

        /* ── Terminal input ─────────────────────────────────────────────── */
        .commune-input {
            background: transparent;
            border: none;
            border-bottom: 1px solid var(--border-dim);
            color: var(--text-bright);
            font-family: var(--font-body);
            font-style: italic;
            font-size: 13px;
            outline: none;
            width: 100%;
            padding: 5px 2px;
            transition: border-color 0.2s;
        }
        .commune-input:focus { border-bottom-color: var(--lav); }
        .commune-input::placeholder { color: var(--text-dim); font-style: italic; }
        .btn-send {
            background: transparent;
            border: 1px solid var(--border-dim);
            color: var(--lav-dim);
            font-family: var(--font-display);
            font-size: 9px;
            font-weight: 500;
            letter-spacing: 0.16em;
            padding: 7px 14px;
            cursor: pointer;
            border-radius: var(--radius);
            transition: background 0.2s, color 0.2s, border-color 0.2s;
            text-transform: uppercase;
            white-space: nowrap;
        }
        .btn-send:hover {
            background: var(--lav-glow);
            color: var(--lav);
            border-color: rgba(184,178,208,0.35);
        }

        /* ── Ethereal live indicator ────────────────────────────────────── */
        .live-orb {
            width: 7px; height: 7px;
            border-radius: 50%;
            background: transparent;
            border: 1.5px solid var(--sage);
            box-shadow: 0 0 5px var(--sage), 0 0 12px rgba(139,184,154,0.2);
            animation: etherealpulse 3s ease-in-out infinite;
        }
        @keyframes etherealpulse {
            0%, 100% { opacity: 1;   box-shadow: 0 0 5px var(--sage), 0 0 12px rgba(139,184,154,0.2); }
            50%       { opacity: 0.4; box-shadow: 0 0 3px var(--sage); }
        }

        /* ── HTMX indicator ─────────────────────────────────────────────── */
        .htmx-indicator { display: none; }
        .htmx-request .htmx-indicator { display: flex; }
        .htmx-request.htmx-indicator  { display: flex; }

        /* ── Processing ─────────────────────────────────────────────────── */
        .weaving-dots span {
            color: var(--lav);
            animation: weavedot 1.5s ease-in-out infinite both;
        }
        .weaving-dots span:nth-child(2) { animation-delay: 0.2s; }
        .weaving-dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes weavedot {
            0%, 80%, 100% { opacity: 0.1; }
            40%            { opacity: 0.9; }
        }

        /* ── Decision results ───────────────────────────────────────────── */
        .result-approved {
            border: 1px solid rgba(139,184,154,0.25);
            border-left: 2px solid var(--sage);
            background: var(--sage-glow);
            color: var(--sage);
            padding: 12px 14px;
            border-radius: var(--radius);
            font-family: var(--font-display);
            font-size: 9px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 9px;
        }
        .result-rejected {
            border: 1px solid rgba(201,147,140,0.22);
            border-left: 2px solid var(--rose);
            background: var(--rose-glow);
            color: var(--rose);
            padding: 12px 14px;
            border-radius: var(--radius);
            font-family: var(--font-display);
            font-size: 9px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 9px;
        }

        /* ── Page-load stagger ──────────────────────────────────────────── */
        @keyframes driftIn {
            from { opacity: 0; transform: translateY(12px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .panel { animation: driftIn 0.5s cubic-bezier(.22,1,.36,1) both; }
        .panel:nth-child(1) { animation-delay: 0.05s; }
        .panel:nth-child(2) { animation-delay: 0.12s; }
        .panel:nth-child(3) { animation-delay: 0.19s; }

        /* ── Mobile tab bar ─────────────────────────────────────────────── */
        .tab-nav {
            display: none;
            flex-shrink: 0;
            background: var(--panel);
            border-top: 1px solid var(--border-mist);
            order: 99;
        }
        .tab-btn {
            flex: 1;
            background: transparent;
            border: none;
            border-top: 2px solid transparent;
            color: var(--text-dim);
            font-family: var(--font-display);
            font-size: 8px;
            font-weight: 500;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            padding: 12px 6px 10px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            transition: color 0.2s, border-color 0.2s;
            min-height: 52px;
        }
        .tab-btn svg { opacity: 0.4; transition: opacity 0.2s; }
        .tab-btn.active {
            color: var(--gold);
            border-top-color: var(--gold);
        }
        .tab-btn.active svg { opacity: 0.85; }
        .queue-badge {
            position: absolute;
            top: 8px;
            right: calc(50% - 15px);
            background: var(--gold);
            color: var(--void);
            font-family: var(--font-display);
            font-size: 7px;
            font-weight: 600;
            min-width: 15px;
            height: 15px;
            border-radius: 8px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0 4px;
            line-height: 1;
        }
        .queue-badge:empty { display: none; }

        /* ── Responsive ─────────────────────────────────────────────────── */
        @media (max-width: 767px) {
            .tab-nav { display: flex; }
            .panes-container { flex-direction: column !important; padding: 0 !important; gap: 0 !important; }
            .pane { display: none !important; border-radius: 0 !important; border-left: none !important; border-right: none !important; border-bottom: none !important; }
            .pane::after { display: none; }
            .pane.active { display: flex !important; flex: 1; }
            .btn-approve, .btn-reject { padding: 13px 8px; font-size: 9px; }
            .btn-send { padding: 10px 16px; }
            button { touch-action: manipulation; }
            .commune-input { font-size: 16px !important; }
            .header-session { display: none; }
            .msg-user-bubble, .msg-agent-bubble { font-size: 14px; }
        }
        @media (min-width: 768px) {
            .pane { display: flex !important; flex: 1; }
            .tab-nav { display: none !important; }
        }
    </style>
</head>
<body>
    <div style="position: relative; z-index: 1; height: 100%;">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
